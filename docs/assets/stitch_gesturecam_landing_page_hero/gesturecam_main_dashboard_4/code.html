<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>GestureCam Main Dashboard</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#6467f2",
                        "background-light": "#f6f6f8",
                        "background-dark": "#101122",
                        "surface": "#1E293B",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .hud-glass {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-white overflow-hidden">
<div class="flex h-screen w-full flex-col">
<!-- Window Title Bar -->
<header class="flex items-center justify-between border-b border-white/5 bg-[#0F172A] px-6 py-3 select-none">
<div class="flex items-center gap-3">
<div class="size-6 text-primary">
<svg fill="none" viewbox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<path d="M13.8261 17.4264C16.7203 18.1174 20.2244 18.5217 24 18.5217C27.7756 18.5217 31.2797 18.1174 34.1739 17.4264C36.9144 16.7722 39.9967 15.2331 41.3563 14.1648L24.8486 40.6391C24.4571 41.267 23.5429 41.267 23.1514 40.6391L6.64374 14.1648C8.00331 15.2331 11.0856 16.7722 13.8261 17.4264Z" fill="currentColor"></path>
<path clip-rule="evenodd" d="M39.998 12.236C39.9944 12.2537 39.9875 12.2845 39.9748 12.3294C39.9436 12.4399 39.8949 12.5741 39.8346 12.7175C39.8168 12.7597 39.7989 12.8007 39.7813 12.8398C38.5103 13.7113 35.9788 14.9393 33.7095 15.4811C30.9875 16.131 27.6413 16.5217 24 16.5217C20.3587 16.5217 17.0125 16.131 14.2905 15.4811C12.0012 14.9346 9.44505 13.6897 8.18538 12.8168C8.17384 12.7925 8.16216 12.767 8.15052 12.7408C8.09919 12.6249 8.05721 12.5114 8.02977 12.411C8.00356 12.3152 8.00039 12.2667 8.00004 12.2612C8.00004 12.261 8 12.2607 8.00004 12.2612C8.00004 12.2359 8.0104 11.9233 8.68485 11.3686C9.34546 10.8254 10.4222 10.2469 11.9291 9.72276C14.9242 8.68098 19.1919 8 24 8C28.8081 8 33.0758 8.68098 36.0709 9.72276C37.5778 10.2469 38.6545 10.8254 39.3151 11.3686C39.9006 11.8501 39.9857 12.1489 39.998 12.236ZM4.95178 15.2312L21.4543 41.6973C22.6288 43.5809 25.3712 43.5809 26.5457 41.6973L43.0534 15.223C43.0709 15.1948 43.0878 15.1662 43.104 15.1371L41.3563 14.1648C43.104 15.1371 43.1038 15.1374 43.104 15.1371L43.1051 15.135L43.1065 15.1325L43.1101 15.1261L43.1199 15.1082C43.1276 15.094 43.1377 15.0754 43.1497 15.0527C43.1738 15.0075 43.2062 14.9455 43.244 14.8701C43.319 14.7208 43.4196 14.511 43.5217 14.2683C43.6901 13.8679 44 13.0689 44 12.2609C44 10.5573 43.003 9.22254 41.8558 8.2791C40.6947 7.32427 39.1354 6.55361 37.385 5.94477C33.8654 4.72057 29.133 4 24 4C18.867 4 14.1346 4.72057 10.615 5.94478C8.86463 6.55361 7.30529 7.32428 6.14419 8.27911C4.99695 9.22255 3.99999 10.5573 3.99999 12.2609C3.99999 13.1275 4.29264 13.9078 4.49321 14.3607C4.60375 14.6102 4.71348 14.8196 4.79687 14.9689C4.83898 15.0444 4.87547 15.1065 4.9035 15.1529C4.91754 15.1762 4.92954 15.1957 4.93916 15.2111L4.94662 15.223L4.95178 15.2312ZM35.9868 18.996L24 38.22L12.0131 18.996C12.4661 19.1391 12.9179 19.2658 13.3617 19.3718C16.4281 20.1039 20.0901 20.5217 24 20.5217C27.9099 20.5217 31.5719 20.1039 34.6383 19.3718C35.082 19.2658 35.5339 19.1391 35.9868 18.996Z" fill="currentColor" fill-rule="evenodd"></path>
</svg>
</div>
<h1 class="text-sm font-bold tracking-tight">GestureCam</h1>
</div>
<div class="flex gap-1">
<button class="flex size-8 items-center justify-center rounded hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined text-lg">minimize</span>
</button>
<button class="flex size-8 items-center justify-center rounded hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined text-lg">check_box_outline_blank</span>
</button>
<button class="flex size-8 items-center justify-center rounded hover:bg-red-500/80 transition-colors">
<span class="material-symbols-outlined text-lg">close</span>
</button>
</div>
</header>
<main class="flex flex-1 flex-col items-center justify-center bg-surface p-8 gap-8">
<!-- Camera Preview / HUD -->
<div class="relative w-full max-w-[960px] aspect-video rounded-xl overflow-hidden bg-black shadow-2xl ring-4 ring-primary/20">
<div class="absolute inset-0 bg-cover bg-center opacity-90" data-alt="webcam preview showing a professional workspace background" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuD3p0CzEAnDQdzgRHGR0fhwp9UX-zIwc9JWxpvMt2rw4NIW45wnRdocSKSW3yNljsmsB3PtM_RC5d8Tgac7E-ZUKlnlYX3PSNnigF5evDRxE1Dlyndxwh6VxO4j82iwzIi2YOBQ-ZXzJ9bDzo28RTxvRrKb6-VleTjanv4qEwKjuLmDpFW4a07ddXAzcpRuTf75-Z5zyXwwRmsdcZmjvfFJMTIPeIW1q42468eb8Aamh4AUHEIDUsXPA9sjrbxg5qUU9hFZ6KbhJdTI");'></div>
<!-- HUD Overlays -->
<div class="absolute inset-0 p-6 flex flex-col justify-between pointer-events-none">
<div class="flex justify-between items-start">
<!-- Current Gesture -->
<div class="hud-glass px-4 py-2 rounded-lg flex items-center gap-3 animate-pulse">
<span class="text-primary material-symbols-outlined fill-1">thumb_up</span>
<span class="text-xs font-bold tracking-wider uppercase">Gesture: Zoom In</span>
</div>
<!-- Zoom Level -->
<div class="hud-glass px-4 py-2 rounded-lg flex flex-col items-end gap-1">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-sm text-gray-400">zoom_in</span>
<span class="text-lg font-bold text-primary">1.8x</span>
</div>
<div class="w-24 h-1 bg-white/20 rounded-full overflow-hidden">
<div class="w-3/5 h-full bg-primary shadow-[0_0_8px_#6467f2]"></div>
</div>
</div>
</div>
<!-- Centered Active Mode Label -->
<div class="flex justify-center">
<div class="hud-glass px-6 py-1.5 rounded-full border-primary/50 flex items-center gap-2">
<div class="size-2 rounded-full bg-primary animate-ping"></div>
<span class="text-[10px] font-black tracking-[0.2em] text-white/90">FACE FOLLOW ACTIVE</span>
</div>
</div>
</div>
<!-- Record Indicator -->
<div class="absolute top-6 left-1/2 -translate-x-1/2 px-3 py-1 bg-red-600 rounded-full flex items-center gap-2">
<div class="size-2 rounded-full bg-white animate-pulse"></div>
<span class="text-[10px] font-bold">LIVE</span>
</div>
</div>
<!-- Framing Mode Selection -->
<div class="w-full max-w-[960px] space-y-4">
<h3 class="text-sm font-semibold text-gray-400 uppercase tracking-widest px-1">Framing Modes</h3>
<div class="grid grid-cols-4 gap-4">
<!-- Manual -->
<label class="group relative cursor-pointer">
<input class="peer sr-only" name="mode" type="radio" value="manual"/>
<div class="flex flex-col items-center gap-3 p-6 rounded-xl bg-[#0F172A] border-2 border-transparent transition-all peer-checked:border-primary peer-checked:bg-primary/10 hover:bg-[#1e293b]">
<span class="material-symbols-outlined text-3xl text-gray-500 group-hover:text-gray-300 transition-colors peer-checked:text-primary">filter_center_focus</span>
<span class="text-sm font-bold text-gray-400 peer-checked:text-white">Manual</span>
</div>
</label>
<!-- Face Follow -->
<label class="group relative cursor-pointer">
<input checked="" class="peer sr-only" name="mode" type="radio" value="face-follow"/>
<div class="flex flex-col items-center gap-3 p-6 rounded-xl bg-[#0F172A] border-2 border-transparent transition-all peer-checked:border-primary peer-checked:bg-primary/10 hover:bg-[#1e293b]">
<span class="material-symbols-outlined text-3xl text-gray-500 group-hover:text-gray-300 transition-colors peer-checked:text-primary fill-1">person_search</span>
<span class="text-sm font-bold text-gray-400 peer-checked:text-white">Face Follow</span>
</div>
</label>
<!-- Headshot -->
<label class="group relative cursor-pointer">
<input class="peer sr-only" name="mode" type="radio" value="headshot"/>
<div class="flex flex-col items-center gap-3 p-6 rounded-xl bg-[#0F172A] border-2 border-transparent transition-all peer-checked:border-primary peer-checked:bg-primary/10 hover:bg-[#1e293b]">
<span class="material-symbols-outlined text-3xl text-gray-500 group-hover:text-gray-300 transition-colors peer-checked:text-primary">account_box</span>
<span class="text-sm font-bold text-gray-400 peer-checked:text-white">Headshot</span>
</div>
</label>
<!-- Shirt-Up -->
<label class="group relative cursor-pointer">
<input class="peer sr-only" name="mode" type="radio" value="shirt-up"/>
<div class="flex flex-col items-center gap-3 p-6 rounded-xl bg-[#0F172A] border-2 border-transparent transition-all peer-checked:border-primary peer-checked:bg-primary/10 hover:bg-[#1e293b]">
<span class="material-symbols-outlined text-3xl text-gray-500 group-hover:text-gray-300 transition-colors peer-checked:text-primary">aspect_ratio</span>
<span class="text-sm font-bold text-gray-400 peer-checked:text-white">Shirt-Up</span>
</div>
</label>
</div>
</div>
</main>
<!-- Status Bar -->
<footer class="bg-[#0F172A] border-t border-white/5 px-8 py-4 flex items-center justify-between">
<div class="flex items-center gap-6">
<div class="flex items-center gap-2">
<div class="size-2 rounded-full bg-emerald-500"></div>
<span class="text-xs font-medium text-gray-400">Camera: Sony A7C - Connected</span>
</div>
<div class="h-4 w-px bg-white/10"></div>
<div class="flex items-center gap-2 text-gray-400">
<span class="material-symbols-outlined text-sm">bolt</span>
<span class="text-xs font-medium">Latency: 12ms</span>
</div>
</div>
<div class="flex items-center gap-4">
<button class="flex items-center justify-center p-2 rounded-lg text-gray-400 hover:bg-white/5 transition-colors">
<span class="material-symbols-outlined">settings</span>
</button>
<button class="flex items-center gap-3 px-6 py-2.5 bg-primary hover:bg-primary/90 rounded-lg font-bold text-sm transition-all shadow-lg shadow-primary/20">
<span class="material-symbols-outlined text-lg fill-1">videocam</span>
                    Start Virtual Camera
                </button>
</div>
</footer>
</div>
</body></html>
