    />

      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"

      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.min.js"

              "background-dark": "#101122",
              surface: "#1E293B",

            fontFamily: { display: ["Inter"] },

      <main

        <!-- Split View: Original | Processed -->
        <div class="w-full max-w-[1100px] flex gap-4">
          <!-- Original Camera -->
          <div

          >
            <video
              id="cameraOriginal"
              class="absolute inset-0 w-full h-full object-cover"
              autoplay
              playsinline
              muted

            <div
              class="absolute top-3 left-3 hud-glass px-2 py-1 rounded text-xs font-bold"
            >
              ORIGINAL
            </div>
            <button
              id="mirrorBtn"
              class="absolute top-3 right-3 hud-glass px-2 py-1 rounded flex items-center gap-1 hover:bg-white/20 transition-colors"
            >
              <span class="material-symbols-outlined text-sm">flip</span>
              <span class="text-xs">Mirror</span>
            </button>
          </div>

          <!-- Processed View with Zoom -->
          <div
            class="relative flex-1 aspect-video rounded-xl overflow-hidden bg-black shadow-xl ring-4 ring-primary/30"
          >
            <canvas
              id="cameraProcessed"
              class="absolute inset-0 w-full h-full"
            ></canvas>
            <div
              class="absolute top-3 left-3 hud-glass px-2 py-1 rounded text-xs font-bold text-primary"
            >
              PROCESSED + ZOOM
            </div>
            <!-- Gesture Indicator -->
            <div
              id="gestureIndicator"
              class="absolute top-3 right-3 hud-glass px-3 py-1.5 rounded-lg flex items-center gap-2 transition-opacity"
            >
              <span
                id="gestureIcon"
                class="text-primary material-symbols-outlined fill-1"
                >front_hand</span

              <span id="gestureText" class="text-xs font-bold"
                >Waiting for gesture...</span

            </div>
            <!-- Zoom Level -->
            <div
              class="absolute bottom-3 right-3 hud-glass px-3 py-1.5 rounded-lg flex items-center gap-2"
            >
              <span class="material-symbols-outlined text-sm text-gray-400"
                >zoom_in</span

            </div>
            <!-- Mode Label -->

            >

                id="modeLabel"
                class="text-[10px] font-black tracking-[0.2em]"
                >FACE FOLLOW ACTIVE</span
              >
            </div>
          </div>
        </div>

        <!-- Framing Mode Selection -->
        <div class="w-full max-w-[1100px] space-y-3">
          <h3
            class="text-sm font-semibold text-gray-400 uppercase tracking-widest px-1"

            Framing Modes

              </div>
            </label>
            <label class="relative cursor-pointer group">
              <input

      <!-- Footer Status Bar -->

    <script src="js/bridge.js"></script>
    <script>
      // Dashboard with split view, mirror, and gesture detection
      document.addEventListener("DOMContentLoaded", function () {
        // Elements
        const videoOriginal = document.getElementById("cameraOriginal");
        const canvasProcessed = document.getElementById("cameraProcessed");
        const ctx = canvasProcessed.getContext("2d");
        const mirrorBtn = document.getElementById("mirrorBtn");
        const gestureIndicator = document.getElementById("gestureIndicator");
        const gestureIcon = document.getElementById("gestureIcon");
        const gestureText = document.getElementById("gestureText");
        const zoomLevel = document.getElementById("zoomLevel");
        const modeLabel = document.getElementById("modeLabel");
        const statusDot = document.getElementById("statusDot");
        const statusText = document.getElementById("statusText");
        const latencyText = document.getElementById("latencyText");
        const startCameraBtn = document.getElementById("startCameraBtn");
        const settingsBtn = document.getElementById("settingsBtn");
        const modeRadios = document.querySelectorAll('input[name="mode"]');

        let stream = null;
        let isMirrored = true; // Default to mirrored (selfie mode)
        let currentZoom = 1.0;
        let targetZoom = 1.0;
        const ZOOM_SMOOTHING = 0.1;
        const MIN_ZOOM = 1.0;
        const MAX_ZOOM = 3.0;

        // MediaPipe Hands for gesture detection
        let hands = null;
        let lastGesture = "none";
        let gestureStartTime = 0;
        const GESTURE_HOLD_MS = 300; // Time to hold gesture before action

        // Initialize MediaPipe Hands
        function initMediaPipe() {
          if (typeof Hands === "undefined") {
            console.warn("MediaPipe not loaded, using keyboard controls only");
            return;
          }

          hands = new Hands({
            locateFile: (file) =>
              `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`,
          });

          hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 0, // Faster
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.5,
          });

          hands.onResults(onHandResults);
          console.log("MediaPipe Hands initialized");
        }

        // Process hand detection results
        function onHandResults(results) {
          if (
            results.multiHandLandmarks &&
            results.multiHandLandmarks.length > 0
          ) {
            const landmarks = results.multiHandLandmarks[0];
            const gesture = detectGesture(landmarks);

            if (gesture !== "none") {
              if (gesture === lastGesture) {
                // Check if held long enough
                if (Date.now() - gestureStartTime > GESTURE_HOLD_MS) {
                  applyGestureZoom(gesture);
                  gestureStartTime = Date.now() + 500; // Cooldown
                }
              } else {
                lastGesture = gesture;
                gestureStartTime = Date.now();
              }
            } else {
              lastGesture = "none";
            }
          } else {
            lastGesture = "none";
          }
        }

        // Detect gesture from hand landmarks
        function detectGesture(landmarks) {
          // Finger tip and pip indices
          const THUMB_TIP = 4,
            THUMB_IP = 3;
          const INDEX_TIP = 8,
            INDEX_PIP = 6;
          const MIDDLE_TIP = 12,
            MIDDLE_PIP = 10;
          const RING_TIP = 16,
            RING_PIP = 14;
          const PINKY_TIP = 20,
            PINKY_PIP = 18;
          const WRIST = 0;

          // Check if thumb is extended (up or down)
          const thumbUp = landmarks[THUMB_TIP].y < landmarks[THUMB_IP].y - 0.05;
          const thumbDown =
            landmarks[THUMB_TIP].y > landmarks[THUMB_IP].y + 0.05;

          // Check if other fingers are closed
          const indexClosed = landmarks[INDEX_TIP].y > landmarks[INDEX_PIP].y;
          const middleClosed =
            landmarks[MIDDLE_TIP].y > landmarks[MIDDLE_PIP].y;
          const ringClosed = landmarks[RING_TIP].y > landmarks[RING_PIP].y;
          const pinkyClosed = landmarks[PINKY_TIP].y > landmarks[PINKY_PIP].y;

          const fingersClosed =
            indexClosed && middleClosed && ringClosed && pinkyClosed;

          // Thumbs up: thumb pointing up, other fingers closed
          if (thumbUp && fingersClosed) {
            return "thumbs_up";
          }

          // Thumbs down: thumb pointing down, other fingers closed
          if (thumbDown && fingersClosed) {
            return "thumbs_down";
          }

          // Open palm: all fingers extended
          const indexOpen = landmarks[INDEX_TIP].y < landmarks[INDEX_PIP].y;
          const middleOpen = landmarks[MIDDLE_TIP].y < landmarks[MIDDLE_PIP].y;
          const ringOpen = landmarks[RING_TIP].y < landmarks[RING_PIP].y;
          const pinkyOpen = landmarks[PINKY_TIP].y < landmarks[PINKY_PIP].y;

          if (indexOpen && middleOpen && ringOpen && pinkyOpen) {
            return "open_palm";
          }

          return "none";
        }

        // Apply zoom based on gesture
        function applyGestureZoom(gesture) {
          if (gesture === "thumbs_up") {
            targetZoom = Math.min(MAX_ZOOM, targetZoom + 0.15);
            showGesture("thumb_up", "Zoom In 👍");
          } else if (gesture === "thumbs_down") {
            targetZoom = Math.max(MIN_ZOOM, targetZoom - 0.15);
            showGesture("thumb_down", "Zoom Out 👎");
          } else if (gesture === "open_palm") {
            // Hold - do nothing but show indicator
            showGesture("front_hand", "Hold 🖐️");
          }
        }

        // Start camera
        async function startCamera() {
          try {
            const devices = await navigator.mediaDevices.enumerateDevices();
            const cameras = devices.filter((d) => d.kind === "videoinput");

            stream = await navigator.mediaDevices.getUserMedia({
              video: {
                width: { ideal: 1280 },
                height: { ideal: 720 },
                facingMode: "user",
              },
              audio: false,
            });

            videoOriginal.srcObject = stream;
            await videoOriginal.play();

            // Apply mirror by default
            if (isMirrored) {
              videoOriginal.classList.add("mirrored");
            }

            // Get camera name
            const track = stream.getVideoTracks()[0];
            const cameraName = track.label || "Camera";
            statusText.textContent = `Camera: ${cameraName}`;
            statusDot.classList.remove("bg-gray-500", "bg-red-500");
            statusDot.classList.add("bg-emerald-500");

            // Setup canvas
            canvasProcessed.width = videoOriginal.videoWidth || 1280;
            canvasProcessed.height = videoOriginal.videoHeight || 720;

            // Initialize MediaPipe and start detection loop
            initMediaPipe();
            if (hands) {
              setInterval(async () => {
                if (videoOriginal.readyState >= 2) {
                  await hands.send({ image: videoOriginal });
                }
              }, 100); // 10 FPS for gesture detection
            }

            // Start render loop
            requestAnimationFrame(renderLoop);
          } catch (err) {
            console.error("Camera error:", err);
            statusText.textContent =
              "Camera: " + (err.message || "Permission denied");
            statusDot.classList.replace("bg-gray-500", "bg-red-500");
          }
        }

        // Render loop - applies zoom to processed view
        function renderLoop() {
          if (!videoOriginal.srcObject) return;

          // Smooth zoom transition
          currentZoom += (targetZoom - currentZoom) * ZOOM_SMOOTHING;

          const vw = videoOriginal.videoWidth;
          const vh = videoOriginal.videoHeight;

          if (vw && vh) {
            canvasProcessed.width = vw;
            canvasProcessed.height = vh;

            // Calculate zoom crop region
            const zoomedWidth = vw / currentZoom;
            const zoomedHeight = vh / currentZoom;
            const sx = (vw - zoomedWidth) / 2;
            const sy = (vh - zoomedHeight) / 2;

            // Clear and draw
            ctx.clearRect(0, 0, vw, vh);

            // Apply mirror if enabled
            if (isMirrored) {
              ctx.save();
              ctx.scale(-1, 1);
              ctx.drawImage(
                videoOriginal,
                sx,
                sy,
                zoomedWidth,
                zoomedHeight,
                -vw,
                0,
                vw,
                vh,
              );
              ctx.restore();
            } else {
              ctx.drawImage(
                videoOriginal,
                sx,
                sy,
                zoomedWidth,
                zoomedHeight,
                0,
                0,
                vw,
                vh,
              );
            }
          }

          // Update zoom display
          zoomLevel.textContent = currentZoom.toFixed(1) + "x";

          // Simulate latency
          const latency = Math.floor(8 + Math.random() * 6);
          latencyText.textContent = latency + "ms";

          requestAnimationFrame(renderLoop);
        }

        // Mirror toggle
        mirrorBtn.addEventListener("click", () => {
          isMirrored = !isMirrored;
          videoOriginal.classList.toggle("mirrored", isMirrored);
          mirrorBtn.classList.toggle("bg-primary/30", isMirrored);
        });

        // Keyboard controls for zoom (for testing)
        document.addEventListener("keydown", (e) => {
          if (e.key === "ArrowUp" || e.key === "+" || e.key === "=") {
            targetZoom = Math.min(MAX_ZOOM, targetZoom + 0.2);
            showGesture("thumb_up", "Zoom In");
          } else if (e.key === "ArrowDown" || e.key === "-") {
            targetZoom = Math.max(MIN_ZOOM, targetZoom - 0.2);
            showGesture("thumb_down", "Zoom Out");
          } else if (e.key === "0") {
            targetZoom = 1.0;
            showGesture("restart_alt", "Reset Zoom");
          }
        });

        // Show gesture indicator
        function showGesture(icon, text) {
          gestureIcon.textContent = icon;
          gestureText.textContent = text;
          gestureIndicator.style.opacity = "1";

          // Sync with API
          if (GestureCam.api) {
            if (icon === "thumb_up") {
              GestureCam.api.zoom_in();
            } else if (icon === "thumb_down") {
              GestureCam.api.zoom_out();
            } else if (icon === "restart_alt") {
              GestureCam.api.reset_zoom();
            }
          }

          clearTimeout(window.gestureTimeout);
          window.gestureTimeout = setTimeout(() => {
            gestureIndicator.style.opacity = "0.5";
            gestureText.textContent = "Waiting for gesture...";
            gestureIcon.textContent = "front_hand";
          }, 2000);
        }

        // Mode change
        modeRadios.forEach((radio) => {
          radio.addEventListener("change", function () {
            const mode = this.value.replace("-", "_");
            modeLabel.textContent =
              mode.toUpperCase().replace("_", " ") + " ACTIVE";
            if (GestureCam.api) {
              GestureCam.api.set_framing_mode(mode);
            }
          });
        });

        // Settings button
        settingsBtn.addEventListener("click", () =>
          GestureCam.navigateTo("settings"),
        );

        // Virtual camera toggle
        startCameraBtn.addEventListener("click", () => {
          if (GestureCam.api) {
            GestureCam.api.toggle_virtual_camera();
          }
        });

        // Initialize
        GestureCam.init(function (api) {
          GestureCam.setupWindowControls();
          startCamera();
        });
      });
    </script>
  </body>
</html>
