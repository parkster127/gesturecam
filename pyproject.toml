[project]
name = "gesturecam"
version = "0.1.0"
description = "Virtual camera controlled by hand gestures and facial expressions using MediaPipe and OpenCV"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "GestureCam Contributors", email = "gesturecam@example.com"}
]
maintainers = [
    {name = "GestureCam Contributors", email = "gesturecam@example.com"}
]
keywords = [
    "computer-vision",
    "gesture-recognition",
    "virtual-camera",
    "mediapipe",
    "opencv",
    "face-tracking",
    "hand-tracking",
    "obs",
    "webcam",
    "zoom",
    "teams",
    "video-conferencing",
    "air-canvas",
    "facial-recognition",
    "attendance-system"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video :: Capture",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: System :: Hardware :: Hardware Drivers",
    "Topic :: Desktop Environment",
]
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.8.0",
    "mediapipe>=0.10.0",
    "pyvirtualcam>=0.10.0",
    "numpy>=1.24.0",
    "dearpygui>=1.11.0",
    "nicegui>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "ruff>=0.0.280",
    "mypy>=1.5.0",
    "pre-commit>=3.3.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.1.0",
    "mkdocstrings>=0.22.0",
]
performance = [
    "psutil>=5.9.0",
    "memory-profiler>=0.61.0",
]

[project.urls]
Homepage = "https://github.com/parkster127/gesturecam"
Documentation = "https://github.com/parkster127/gesturecam#readme"
Repository = "https://github.com/parkster127/gesturecam"
Issues = "https://github.com/parkster127/gesturecam/issues"
Changelog = "https://github.com/parkster127/gesturecam/blob/main/CHANGELOG.md"
Security = "https://github.com/parkster127/gesturecam/blob/main/SECURITY.md"
"Source Code" = "https://github.com/parkster127/gesturecam"

[project.scripts]
gesturecam = "gesturecam.__main__:main"
gesturecam-ui = "gesturecam.ui.native_ui:run_demo"
gesturecam-web = "gesturecam.ui.web_ui:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["gesturecam"]

[tool.setuptools.package-data]
gesturecam = ["py.typed", "*.json", "data/*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.venv
    | \.pytest_cache
    | \.ruff_cache
    | build
    | dist
    | venv
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    ".venv",
    "venv",
    "build",
    "dist",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # Line too long (handled by black)
    "B008",  # Do not perform function calls in argument defaults
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
exclude = [
    "venv",
    ".venv",
    "build",
    "dist",
]

[[tool.mypy.overrides]]
module = "cv2.*,mediapipe.*,dearpygui.*,nicegui.*,pyvirtualcam.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_core.py", "test_vision.py"]
addopts = ["-v", "--tb=short"]

[tool.coverage.run]
source = ["gesturecam"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
precision = 2